syntax = "proto3";

option csharp_namespace = "IAM.Grpc";

package iam;

service UserService
{   rpc DeleteUser(DeleteUserRequest)
        returns (DeleteUserResponse);
    rpc CreateUser(CreateUserRequest)
        returns (CreateUserResponse);
    rpc UpdateUser(UpdateUserRequest) 
        returns (UpdateUserResponse);
    rpc GetUserByPhone(GetUserByPhoneRequest)
        returns (GetUserByPhoneResponse);
    rpc GetUserById(GetUserByIdRequest)
        returns (GetUserByIdResponse); 
            rpc CreateUserD(CreateUserDRequest) returns (CreateUserResponse);
}

message CreateUserRequest
{
    string email = 1;
    string countryCode = 2;
    string phoneNumber = 3;
}

message CreateUserResponse
{
    string userId = 1;
}
message UpdateUserRequest {
  string user_id = 1;
  string email = 2;
  string country_code = 3;
  string phone_number = 4;
}

message UpdateUserResponse {
  bool success = 1;
}
message DeleteUserRequest
{
    string userId = 1;
}

message DeleteUserResponse
{
    bool success = 1;
}
message GetUserByPhoneRequest
{
    string phoneNumber = 1;
}

message GetUserByPhoneResponse
{
    string userId = 1;
    bool success = 2;
}
message GetUserByIdRequest
{
    string userId = 1;
}

message GetUserByIdResponse
{
    bool success = 1;

    string userId = 2;

    string name = 3;

    string countryCode = 4;

    string phoneNumber = 5;
    optional string email = 6;
}
message CreateUserDRequest {
    string name = 1;
    string email = 2;
    string country_code = 3;
    string phone_number = 4;
}